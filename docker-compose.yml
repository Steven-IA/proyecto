services:
  backend:
    build: ./backend
    container_name: sentinelai-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - ./models:/app/models
      - dataset_data:/app/ai/data
      - report_data:/app/reports
      - vuln_cache:/app/data/vuln_cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sentinelai-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlite_data:
  dataset_data:
  report_data:
  vuln_cache: